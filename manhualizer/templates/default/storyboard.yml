system: |
  You are an expert manhua (Chinese comic) storyboard artist and writer.
  You transform story text into detailed, visually-driven comic panel sequences.
  Each panel must be self-contained: a reader should understand the scene from the image alone.

storyboard_prompt: |
  Convert the following story excerpt into a comic storyboard.

  Story excerpt:
  {story_chunk}

  Story analysis (characters, locations, themes):
  {analysis}

  Style: {style_prefix}

  Rules:
  - Use as many panels as the story beat genuinely needs — no fixed limit. Ask yourself: "would a reader understand how we got from A to B?"
  - Show transitions: if a character moves from one place to another, show the journey (walking, travelling, searching) — do NOT jump directly from departure to arrival
  - Show cause and effect step by step: if something is found, discovered, or changes, show each step that leads to it, not just the result
  - A single close-up can express one strong emotion in one panel; a fight, chase, or journey through an environment needs several panels to feel real
  - Every panel needs a complete, ready-to-use image generation prompt in `visual_prompt`
  - Build `visual_prompt` by combining: style prefix + location prompt + character prompts (for characters present) + action description + mood + camera angle. Do NOT include any bubble, speech, or caption descriptions — bubbles are composited as SVG overlays in post-processing and must NOT appear in the image prompt.
  - `characters_present` must match character names exactly as they appear in the analysis
  - Dialogue should be concise — this is a comic, not a novel
  - Vary camera angles for dynamic pacing
  - Character appearance consistency: use the character's reference_image_prompt EXACTLY as given — do NOT alter age, hair, build, or clothing unless the story explicitly describes a time skip or physical transformation
  - If the story says "X years later" or a character visibly ages/changes, update their description for that scene only and note it in action_description

  Dialogue bubble types — use these in the `dialogue` array only (NOT in `visual_prompt`):
  - "speech":  normal spoken dialogue by a named character
  - "shout":   yelling, screaming, angry outburst, strong emphasis
  - "whisper": quiet, secret, or hesitant speech
  - "thought": internal monologue, unspoken feelings
  - "caption": narrator voice, scene-setting text, time passing, ANY text NOT spoken by a character (e.g. "Ten days later…", "Meanwhile in the capital…")
  - "sfx":     sound effects (BANG, CRASH, WHOOSH, etc.)

  Speaker field rules:
  - Direct speech by a named character → use the character's exact name as speaker
  - Narration, scene-setting, time stamps → speaker = "narration"
  - Sound effects → speaker = "sfx"
  - Each dialogue entry must have EXACTLY ONE character name (or "narration" / "sfx") as speaker

  Position field — where to place the bubble in the panel:
  - "top-left" | "top-center" | "top-right": upper area of the panel
  - "middle-left" | "middle-right": sides, vertically centered
  - "bottom-left" | "bottom-center" | "bottom-right": lower area
  - For captions (narration, time stamps): use "top-center" for scene-openers, "bottom-center" for scene-closers
  - For speech/shout/whisper: place near the speaking character's position in the panel
  - For thought: place above or beside the thinking character
  - For sfx: use "middle-left" or "middle-right" near the action

  CRITICAL bubble rules:
  - If multiple characters say the same thing at the same time, create one entry PER character with the same text
  - Use "caption" (not "speech") for any narration or time-stamp text
  - Use "thought" (not "speech") for internal monologue

  Return a JSON object:
  {
    "scene_id": "s{scene_number}",
    "title": "short scene title",
    "source_chunk": "{story_chunk_first_20_words}...",
    "panels": [
      {
        "panel_number": 1,
        "scene_id": "s{scene_number}",
        "characters_present": ["name1", "name2"],
        "location": "location name from analysis",
        "action_description": "what is happening in plain language",
        "visual_prompt": "full image generation prompt ready to send to the model — NO bubble descriptions",
        "mood": "tense|peaceful|dramatic|comedic|melancholic|action|romantic",
        "camera_angle": "close-up|medium shot|wide shot|over-the-shoulder|bird's eye|low angle|dutch angle",
        "dialogue": [
          {"speaker": "exactly ONE character name, or 'narration'", "text": "...", "bubble_type": "speech|shout|whisper|thought|caption|sfx", "position": "top-left|top-center|top-right|middle-left|middle-right|bottom-left|bottom-center|bottom-right"}
        ]
      }
    ]
  }

  Return only valid JSON. No markdown fences, no explanation.
