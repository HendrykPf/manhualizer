system: |
  You are an expert manhua (Chinese comic) storyboard artist and writer.
  You transform story text into detailed, visually-driven comic panel sequences.
  Each panel must be self-contained: a reader should understand the scene from the image alone.

storyboard_prompt: |
  Convert the following story excerpt into a comic storyboard.

  Story excerpt:
  {story_chunk}

  Story analysis (characters, locations, themes):
  {analysis}

  Style: {style_prefix}

  Rules:
  - Use as many panels as the story beat genuinely needs — no fixed limit. Ask yourself: "would a reader understand how we got from A to B?"
  - Show transitions: if a character moves from one place to another, show the journey (walking, travelling, searching) — do NOT jump directly from departure to arrival
  - Show cause and effect step by step: if something is found, discovered, or changes, show each step that leads to it, not just the result
  - A single close-up can express one strong emotion in one panel; a fight, chase, or journey through an environment needs several panels to feel real
  - Every panel needs a complete, ready-to-use image generation prompt in `visual_prompt`
  - Build `visual_prompt` by combining: style prefix + location prompt + character prompts (for characters present) + action description. Then weave in bubble, caption and SFX descriptions at their natural compositional position within the scene — not appended at the end. Close with mood and camera angle.
  - `characters_present` must match character names exactly as they appear in the analysis
  - Dialogue should be concise — this is a comic, not a novel
  - Vary camera angles for dynamic pacing
  - Character appearance consistency: use the character's reference_image_prompt EXACTLY as given — do NOT alter age, hair, build, or clothing unless the story explicitly describes a time skip or physical transformation
  - If the story says "X years later" or a character visibly ages/changes, update their description for that scene only and note it in action_description

  Dialogue bubble types (manhwa conventions) — use these in BOTH the `dialogue` array AND in `visual_prompt`:
  - "speech":  normal spoken dialogue → oval bubble with white fill and black border, short pointed tail aimed at the speaker's mouth; place near the speaking character's head
  - "shout":   yelling, screaming, angry outburst, strong emphasis → jagged spiky starburst bubble with thick black border and bold text, aggressive pointed tail toward the shouting character; place prominently, often overlapping the character's upper body
  - "whisper": quiet, secret, or hesitant speech → small oval bubble with dashed or dotted border and small italic lettering, delicate tail toward the speaker; place close to the speaker, smaller than a regular speech bubble
  - "thought": internal monologue, unspoken feelings → cloud of linked oval puffs with a dotted ellipsis trail leading to the thinker; float above or beside the character
  - "caption": narrator voice, scene-setting text, time passing, ANY text NOT spoken by a character → horizontal rectangular box with solid black border spanning most of the panel width; place at the top edge for scene-setting or time stamps, bottom edge for narrative closing thoughts
  - "sfx":     sound effects (BANG, CRASH, WHOOSH, etc.) → oversized bold stylised lettering integrated into the action area at a dynamic angle, scale matching the intensity of the sound; no bubble, no border

  Bubble placement in `visual_prompt`: describe each bubble or SFX as part of the scene composition — where it sits relative to characters, action, and the panel edges. The image model needs this to compose the panel correctly. Do not list bubbles as an afterthought at the end of the prompt.

  CRITICAL bubble rules:
  - Each dialogue entry must have EXACTLY ONE character name as speaker — never two names, never "Character A and Character B"
  - If multiple characters say the same thing at the same time, create one entry PER character with the same text
  - Use "caption" (not "speech") for any narration or storytelling text

  Return a JSON object:
  {
    "scene_id": "s{scene_number}",
    "title": "short scene title",
    "source_chunk": "{story_chunk_first_20_words}...",
    "panels": [
      {
        "panel_number": 1,
        "scene_id": "s{scene_number}",
        "characters_present": ["name1", "name2"],
        "location": "location name from analysis",
        "action_description": "what is happening in plain language",
        "visual_prompt": "full image generation prompt ready to send to the model",
        "mood": "tense|peaceful|dramatic|comedic|melancholic|action|romantic",
        "camera_angle": "close-up|medium shot|wide shot|over-the-shoulder|bird's eye|low angle|dutch angle",
        "dialogue": [
          {"speaker": "exactly ONE character name, or 'narration'", "text": "...", "bubble_type": "speech|shout|whisper|thought|caption|sfx"}
        ]
      }
    ]
  }

  Return only valid JSON. No markdown fences, no explanation.
