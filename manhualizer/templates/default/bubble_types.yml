# Visual prompt templates for each speech bubble type.
# These are sent to the ComfyUI speech bubble workflow.
# Variables: {speaker} = character name, {text} = dialogue text
#
# Customise these for your story by creating a bubble_types.yml in your
# custom_templates_dir and overriding only the types you want to change.

speech: >-
  ONE single oval speech bubble (no duplicates, no extras), white fill, black border,
  pointed tail toward {speaker}'s mouth, placed in the nearest empty corner or edge
  far from faces and key action, text inside bubble: "{text}"

shout: >-
  ONE single jagged spiky starburst shout bubble (no duplicates, no extras),
  thick black border, oversized bold black text, placed at the panel edge far from
  the main subject, aggressive tail toward {speaker}, text inside bubble: "{text}"

whisper: >-
  ONE single small oval bubble with dashed border (no duplicates, no extras),
  small italic text, tucked into a quiet corner near {speaker},
  delicate tail toward {speaker}'s mouth, text inside bubble: "{text}"

thought: >-
  ONE single thought bubble of linked oval puffs (no duplicates, no extras),
  dotted ellipsis trail toward {speaker}, floating in empty space above or beside
  {speaker} far from other characters, text inside bubble: "{text}"

caption: >-
  ONE single rectangular caption box (no duplicates, no extras), solid black border,
  white fill, full panel width, placed at the TOP edge of the panel if the top quarter
  is empty, otherwise at the BOTTOM edge — never overlapping characters or action,
  text inside box: "{text}"

sfx: >-
  ONE single instance of oversized bold stylised sound-effect text "{text}"
  (no duplicates, no extras), integrated into the action background,
  dynamic angle, no bubble or border
