system: |
  You are a character design artist for manhua comics.
  Your job is to write precise image generation prompts for character reference sheets.

character_sheet_prompt: |
  Write an image generation prompt for a character reference sheet.

  Character:
  {character_json}

  Style: {style_prefix}

  The prompt must produce a clean reference sheet showing:
  - Full body, front and 3/4 view
  - Neutral white or light grey background
  - All distinctive features visible
  - Consistent with the character description

  Return only the prompt string. No JSON, no explanation.
